version: '3.8'

services:
  # PostgreSQL - User/Workspace/Policy Data
  postgres:
    image: postgres:15
    container_name: insurance-postgres
    environment:
      POSTGRES_USER: insurance_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insurance_secure_2024}
      POSTGRES_DB: insurance_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Chat Memory / Session
  redis:
    image: redis:7-alpine
    container_name: insurance-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant - Vector Database (Global RAG)
  qdrant-global:
    image: qdrant/qdrant:latest
    container_name: insurance-qdrant-global
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_global_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant Instance 2 - Workspace RAG (Layer 2)
  qdrant-workspace:
    image: qdrant/qdrant:latest
    container_name: insurance-qdrant-workspace
    ports:
      - "7333:6333"
      - "7334:6334"
    volumes:
      - qdrant_workspace_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  qdrant_global_data:
  qdrant_workspace_data: